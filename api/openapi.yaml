# The API contract between backend and frontend. This file is the source:
# `make generate` derives the Go types (backend/internal/httpapi/apigen) and
# the TypeScript types (frontend/src/types/openapi.gen.ts) from it.
# Change the API here first, then regenerate and let both compilers point
# out what no longer fits.
#
# OpenAPI 3.0 instead of 3.1, because oapi-codegen does not fully support
# 3.1 yet.
openapi: 3.0.3

info:
  title: Mitbringsel API
  version: "1"
  description: |
    REST API of Mitbringsel. All endpoints answer JSON; errors share one
    format (`Error`) with a machine-readable code that the frontend
    translates.

    State-changing requests (POST, PUT, PATCH, DELETE) sent from another
    site are rejected with `403 CROSS_ORIGIN_REQUEST` (CSRF protection).

servers:
  - url: /api/v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the server and the database are reachable
      tags: [system]
      responses:
        "200":
          description: Server and database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"

  /me:
    get:
      operationId: getMe
      summary: Get the logged-in user
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: |
        Deletes the session and clears the cookie. Works without a valid
        session as well; the user is logged out either way.
      tags: [auth]
      responses:
        "204":
          description: Logged out; the response clears the session cookie.
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/google/login:
    get:
      operationId: googleLogin
      summary: Start the Google login
      description: |
        Opened by navigation, not fetch. Remembers a login attempt (state,
        nonce, PKCE verifier) in a short-lived cookie and redirects to
        Google. Answers 404 if the Google login is not configured, which
        only development allows.
      tags: [auth]
      responses:
        "302":
          description: Redirect to Google's sign-in page.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish the Google login
      description: |
        Google redirects the browser here. On success the response sets the
        session cookie and redirects to `/`. On failure it redirects to
        `/login?error=access_denied` (cancelled at Google) or
        `/login?error=login_failed` (anything else).
      tags: [auth]
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of code if the login did not happen.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the app or back to the login page.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Log in without Google (development only)
      description: |
        Only exists with `APP_ENV=development`; elsewhere it answers 404.
        Creates the user on first login and sets the session cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "204":
          description: Logged in; the response sets the session cookie.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups:
    get:
      operationId: listGroups
      summary: List the groups of the logged-in user
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All groups the user is a member of, with their members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createGroup
      summary: Create a group
      description: The logged-in user becomes its only member and owner.
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupNameRequest"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: Get one group
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameGroup
      summary: Rename a group
      description: Owners only.
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupNameRequest"
      responses:
        "200":
          description: The renamed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGroup
      summary: Delete a group
      description: Owners only. Removes the group with all its members.
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: setMemberRole
      summary: Change the role of a member
      description: |
        Owners only. The last owner cannot step down (`409 LAST_OWNER`).
        Setting the role a member already has is not an error.
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "204":
          description: The role is set.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave the group
      description: |
        Everyone may remove themselves (leave the group); removing someone
        else needs an owner. The last owner cannot be removed
        (`409 LAST_OWNER`): someone else has to become owner first, or the
        group is deleted.
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The member is no longer in the group.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      # Staging and production; local development uses "session".
      name: __Host-session

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"

  responses:
    Error:
      description: The request failed; `error.code` says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ID:
      type: string
      format: uuid
      # The Go side uses google/uuid like the rest of the backend,
      # instead of oapi-codegen's own UUID type.
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Me:
      type: object
      required: [id, email, displayName, avatarUrl, locale, theme]
      properties:
        id:
          type: string
          format: uuid
          # The Go side uses google/uuid like the rest of the backend,
          # instead of oapi-codegen's own UUID type.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: null if the user has no avatar.
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"

    Locale:
      type: string
      enum: [de, en]

    Theme:
      type: string
      enum: [light, dark, system]

    Group:
      type: object
      description: A group as one of its members sees it.
      required: [id, name, role, members, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/GroupRole"
          description: The role of the logged-in user in this group.
        members:
          type: array
          description: Everyone in the group, including the logged-in user.
          items:
            $ref: "#/components/schemas/GroupMember"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupMember:
      type: object
      required: [userId, displayName, avatarUrl, role, joinedAt]
      properties:
        userId:
          $ref: "#/components/schemas/ID"
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: null if the user has no avatar.
        role:
          $ref: "#/components/schemas/GroupRole"
        joinedAt:
          type: string
          format: date-time

    GroupRole:
      type: string
      description: |
        `owner` manages the group (rename, delete, members, roles); `member`
        uses its lists.
      enum: [owner, member]

    GroupNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 100 characters after trimming; otherwise
            `400 GROUP_NAME_INVALID`.

    SetMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/GroupRole"

    DevLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: string
          description: Optional; the part of the email before the @ if empty.
          # A missing name is the same as an empty one, so Go gets a plain
          # string instead of a pointer.
          x-go-type-skip-optional-pointer: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"

    ErrorCode:
      type: string
      description: Machine-readable error; the frontend translates it.
      enum:
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - DB_UNAVAILABLE
        - UNAUTHENTICATED
        - INTERNAL_ERROR
        - CROSS_ORIGIN_REQUEST
        - INVALID_REQUEST
        - INVALID_IDENTITY
        - GROUP_OWNER_REQUIRED
        - GROUP_NAME_INVALID
        - LAST_OWNER
      # Go constant names; without them oapi-codegen would turn NOT_FOUND
      # into NOTFOUND.
      x-enum-varnames:
        - NotFound
        - MethodNotAllowed
        - DBUnavailable
        - Unauthenticated
        - Internal
        - CrossOrigin
        - InvalidRequest
        - InvalidIdentity
        - GroupOwnerRequired
        - GroupNameInvalid
        - LastOwner
