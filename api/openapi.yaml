# The API contract between backend and frontend. This file is the source:
# `make generate` derives the Go types (backend/internal/httpapi/apigen) and
# the TypeScript types (frontend/src/types/openapi.gen.ts) from it.
# Change the API here first, then regenerate and let both compilers point
# out what no longer fits.
#
# OpenAPI 3.0 instead of 3.1, because oapi-codegen does not fully support
# 3.1 yet.
openapi: 3.0.3

info:
  title: Mitbringsel API
  version: "1"
  description: |
    REST API of Mitbringsel. All endpoints answer JSON; errors share one
    format (`Error`) with a machine-readable code that the frontend
    translates.

    State-changing requests (POST, PUT, PATCH, DELETE) sent from another
    site are rejected with `403 CROSS_ORIGIN_REQUEST` (CSRF protection).

servers:
  - url: /api/v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the server and the database are reachable
      tags: [system]
      responses:
        "200":
          description: Server and database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"

  /me:
    get:
      operationId: getMe
      summary: Get the logged-in user
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: |
        Deletes the session and clears the cookie. Works without a valid
        session as well; the user is logged out either way.
      tags: [auth]
      responses:
        "204":
          description: Logged out; the response clears the session cookie.
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /auth/google/login:
    get:
      operationId: googleLogin
      summary: Start the Google login
      description: |
        Opened by navigation, not fetch. Remembers a login attempt (state,
        nonce, PKCE verifier) and the optional `next` path in a short-lived
        cookie and redirects to Google. Answers 404 if the Google login is
        not configured, which only development allows.

        Over the rate limit it redirects to
        `/login?error=rate_limited` (with `next` passed on, and `Retry-After`
        set) instead of answering 429: the browser shows the login page, not
        raw JSON.
      tags: [auth]
      parameters:
        - name: next
          in: query
          description: |
            Where to go after the login, e.g. `/invite/<token>`. Only a path
            inside the app is accepted (starts with a single `/`, no
            backslash or control characters, at most 512 bytes); anything
            else is ignored and the login ends on `/`.
          schema:
            type: string
      responses:
        "302":
          description: |
            Redirect to Google's sign-in page, or to the login page if the
            rate limit is exceeded.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: Finish the Google login
      description: |
        Google redirects the browser here. On success the response sets the
        session cookie and redirects to the `next` path of the login, or to
        `/` if there was none. On failure it redirects to
        `/login?error=access_denied` (cancelled at Google) or
        `/login?error=login_failed` (anything else), with `&next=<path>`
        appended if the login had one, so "Try again" leads back to it. Over
        the rate limit it redirects to `/login?error=rate_limited`.
      tags: [auth]
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of code if the login did not happen.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the app or back to the login page.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"

  /auth/dev/login:
    post:
      operationId: devLogin
      summary: Log in without Google (development only)
      description: |
        Only exists with `APP_ENV=development`; elsewhere it answers 404.
        Creates the user on first login and sets the session cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "204":
          description: Logged in; the response sets the session cookie.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups:
    get:
      operationId: listGroups
      summary: List the groups of the logged-in user
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The groups the user is a member of, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createGroup
      summary: Create a group
      description: The logged-in user becomes its owner.
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupNameRequest"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: Get a group with its members
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateGroup
      summary: Rename a group
      description: Owner and admins only.
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupNameRequest"
      responses:
        "200":
          description: The renamed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteGroup
      summary: Delete a group with everything in it
      description: Owner only.
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The group is deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group, or leave it
      description: |
        With the logged-in user's own ID this leaves the group, which every
        role but the owner may do. Removing someone else needs a higher
        role: the owner removes admins and members, an admin only members.
        A user who is not in the group is answered with `GROUP_NOT_FOUND`,
        like an unknown group, so the answer does not reveal who is a
        member.
      tags: [groups]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The user is no longer a member.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/members/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: setGroupMemberRole
      summary: Make a member admin or plain member
      description: |
        Owner only. Only `admin` and `member` can be given (`INVALID_ROLE`
        otherwise); the owner's own role never changes (`OWNER_IMMUTABLE`).
      tags: [groups]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "204":
          description: The member has the role now.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/invites:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listInvites
      summary: List the open invite links of a group
      description: |
        Owner and admins only. Links that are expired or revoked are left
        out, and so are the tokens: they are shown once, when the link is
        created.
      tags: [invites]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The open invites, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite link
      description: |
        Owner and admins only. The link works for several people for 7 days
        or until it is revoked. A group can have 10 open links at once
        (`TOO_MANY_INVITES`). The response is the only time the token is
        shown; the frontend builds the link `/invite/<token>` from it.
      tags: [invites]
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new invite with its token.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
    delete:
      operationId: revokeInvite
      summary: Revoke an invite link
      description: |
        Owner and admins only. People who joined through the link stay in
        the group.
      tags: [invites]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The invite is revoked.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: |
            No such group, or the group has no such open invite
            (`GROUP_NOT_FOUND` or `INVITE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /groups/{groupId}/lists:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listLists
      summary: List the lists of a group
      description: |
        Oldest first. Archived lists only come along with
        `includeArchived=true`. A group the user is not a member of looks
        like a group that does not exist (`LIST_NOT_FOUND`).
      tags: [lists]
      security:
        - sessionCookie: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The lists of the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createList
      summary: Create a list in a group
      description: Every member may do this.
      tags: [lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListNameRequest"
      responses:
        "201":
          description: The new list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: getList
      summary: Get a list
      tags: [lists]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateList
      summary: Rename a list
      description: Every member may do this.
      tags: [lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListNameRequest"
      responses:
        "200":
          description: The renamed list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteList
      summary: Delete a list with all its items
      description: Owner and admins only.
      tags: [lists]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The list is deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /lists/{listId}/archived:
    parameters:
      - $ref: "#/components/parameters/ListId"
    put:
      operationId: setListArchived
      summary: Archive a list or bring it back
      description: |
        Every member may do this. Archiving an archived list keeps its
        original `archivedAt`.
      tags: [lists]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetListArchivedRequest"
      responses:
        "200":
          description: The list in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: listItems
      summary: List the items of a list
      description: Oldest first. Deleted items are left out.
      tags: [items]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The items of the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createItem
      summary: Add an item to a list
      description: |
        Every member may do this, also in an archived list. The `id` is
        optional: without it the server picks one. Sending the same `id` for
        the same list again returns the stored item unchanged; an `id` that
        belongs to another list or to a deleted item is `ITEM_ID_TAKEN`.
      tags: [items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /lists/{listId}/items/remove-checked:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: removeCheckedItems
      summary: Delete the checked items of a list at once
      description: |
        Every member may do this, also in an archived list. The client sends
        the items it shows as checked; the server deletes those that belong
        to the list and are still checked. An item that someone unchecked
        meanwhile stays, and so does one checked after the client looked.
        IDs of other lists, unknown or deleted items are skipped without an
        error. The answer lists what was deleted; the group gets one
        `itemsDeleted` event, none if nothing was deleted.
      tags: [items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveCheckedItemsRequest"
      responses:
        "200":
          description: The items that were deleted, in no particular order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedItems"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      summary: Get an item
      tags: [items]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateItem
      summary: Change an item
      description: |
        Every member may do this. Send the fields to change; a field that is
        left out stays as it is. `quantity`, `unit` and `note` can be set to
        `null` to remove them; `name` and `checked` cannot be `null`. At
        least one field is required. Checking an item records who and when.

        Changes are merged per field (last write wins): the server gives
        each REST change the newest clock, so the latest request wins.
      tags: [items]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: The item as it is stored now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteItem
      summary: Delete an item
      description: |
        Every member may do this. Deleting an item that is deleted already
        is fine and answers 204, too.
      tags: [items]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The item is deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      operationId: previewInvite
      summary: See what an invite link leads to
      description: |
        Needs no login, so the page behind the link can show who invites to
        which group before asking to sign in. Whoever holds the token sees
        the group name, the inviting person, the member count and the first
        few members by first name; nothing more.
      tags: [invites]
      responses:
        "200":
          description: The invite is valid.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Error"

  /invites/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    post:
      operationId: acceptInvite
      summary: Join the group behind an invite link
      description: |
        The user becomes a plain member. Someone who is a member already
        keeps their role, so opening the link twice changes nothing.
      tags: [invites]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user is a member now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Error"

  /ws:
    get:
      operationId: connectWebSocket
      summary: Open the live connection
      description: |
        Upgrades the request to a WebSocket. The session cookie is required
        and the `Origin` header must match the app, otherwise the upgrade
        is refused.

        Messages are JSON text frames with the envelope
        `{"type": "...", "payload": {...}}`. The client sends
        `ClientMessage`, the server sends `ServerMessage`. After the
        upgrade the server joins the connection to all groups of the user
        and sends `ready`; the client then reloads what it has loaded via
        REST. Delivery is best effort, REST stays the source of truth.
      tags: [sync]
      security:
        - sessionCookie: []
      responses:
        "101":
          description: Switching protocols; the connection is now a WebSocket.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: |
            The `Origin` header does not match the app
            (`CROSS_ORIGIN_REQUEST`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            The user already holds the maximum number of connections, or
            opened too many in a minute (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          description: The server is shutting down (`INTERNAL_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      # Staging and production; local development uses "session".
      name: __Host-session

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: uuid.UUID
        x-go-type-import:
          path: github.com/google/uuid

    InviteToken:
      name: token
      in: path
      required: true
      description: The secret from the invite link.
      schema:
        type: string

  responses:
    Error:
      description: The request failed; `error.code` says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests; `Retry-After` says in seconds when to try again.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Me:
      type: object
      required: [id, email, displayName, avatarUrl, locale, theme]
      properties:
        id:
          type: string
          format: uuid
          # The Go side uses google/uuid like the rest of the backend,
          # instead of oapi-codegen's own UUID type.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: null if the user has no avatar.
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"

    Group:
      type: object
      required: [id, name, role, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: The role of the logged-in user in this group.
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    GroupMember:
      type: object
      required: [userId, displayName, avatarUrl, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: null if the member has no avatar.
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time

    GroupNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 30 characters after trimming whitespace, otherwise
            `GROUP_NAME_INVALID`.

    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      description: |
        The owner created the group and is the only one. Admins help run
        it; members use it.
      enum: [owner, admin, member]

    List:
      type: object
      required: [id, groupId, name, archivedAt, createdAt, updatedAt, serverSeq]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: null for an active list.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        serverSeq:
          type: integer
          format: int64
          description: |
            Orders changes across lists and items; clients ask for what
            changed after the last one they saw.

    ListList:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/List"

    ListNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            1 to 50 characters after trimming whitespace, otherwise
            `LIST_NAME_INVALID`.

    SetListArchivedRequest:
      type: object
      required: [archived]
      properties:
        archived:
          type: boolean

    Item:
      type: object
      required:
        - id
        - listId
        - name
        - quantity
        - unit
        - note
        - checked
        - checkedBy
        - checkedAt
        - createdBy
        - createdAt
        - serverSeq
        - clocks
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        listId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        name:
          type: string
        quantity:
          type: number
          format: double
          nullable: true
          description: null if the item has no quantity.
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
          description: null if the item has no unit.
        note:
          type: string
          nullable: true
          description: null if the item has no note.
        checked:
          type: boolean
        checkedBy:
          type: string
          format: uuid
          nullable: true
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: |
            The member who checked the item; null while it is not checked, or
            if that person deleted their account.
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: null while the item is not checked.
        createdBy:
          type: string
          format: uuid
          nullable: true
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: null if that person deleted their account.
        createdAt:
          type: string
          format: date-time
        serverSeq:
          type: integer
          format: int64
          description: |
            Orders changes across lists and items; clients ask for what
            changed after the last one they saw.
        clocks:
          $ref: "#/components/schemas/ItemClocks"

    ItemClocks:
      type: object
      description: |
        The hybrid logical clock (HLC) of the latest accepted change per
        field, `<wall>-<counter>-<node>` (docs/sync.md). Clients need them to
        merge changes per field.
      required: [name, quantity, unit, note, checked]
      properties:
        name:
          type: string
        quantity:
          type: string
        unit:
          type: string
        note:
          type: string
        checked:
          type: string

    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    CreateItemRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: |
            Optional. A UUID chosen by the client (UUIDv7); the server picks
            one if it is left out.
        name:
          type: string
          description: |
            1 to 100 characters after trimming whitespace, otherwise
            `ITEM_NAME_INVALID`.
        quantity:
          type: number
          format: double
          nullable: true
          description: |
            Above 0 and at most 100000, otherwise `ITEM_QUANTITY_INVALID`.
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
          description: Otherwise `ITEM_UNIT_INVALID`.
        note:
          type: string
          nullable: true
          description: |
            At most 500 characters after trimming; blank counts as no note.
            Otherwise `ITEM_NOTE_INVALID`.

    RemoveCheckedItemsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          maxItems: 500
          description: At most 500 items, otherwise `INVALID_REQUEST`. An empty array deletes nothing.
          items:
            type: string
            format: uuid
            x-go-type: uuid.UUID
            x-go-type-import:
              path: github.com/google/uuid

    RemovedItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeletedItem"

    UpdateItemRequest:
      type: object
      description: |
        At least one field. `quantity`, `unit` and `note` accept `null` to
        remove the value; for `name` and `checked`, `null` is an invalid
        request.
      properties:
        name:
          type: string
        quantity:
          type: number
          format: double
          nullable: true
        unit:
          allOf:
            - $ref: "#/components/schemas/Unit"
          nullable: true
        note:
          type: string
          nullable: true
        checked:
          type: boolean

    Unit:
      type: string
      description: How a quantity is measured; the frontend translates it.
      enum: [piece, g, kg, ml, l, pack]

    Invite:
      type: object
      required: [id, createdAt, expiresAt, createdByName]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
          description: null if the creator deleted their account.

    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"

    InviteCreated:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Secret part of the link. Shown only in this response, the
                server keeps just a hash.

    InvitePreview:
      type: object
      required:
        [
          groupName,
          invitedByName,
          invitedByAvatarUrl,
          expiresAt,
          memberCount,
          members,
        ]
      properties:
        groupName:
          type: string
        invitedByName:
          type: string
          nullable: true
          description: null if the inviting person deleted their account.
        invitedByAvatarUrl:
          type: string
          nullable: true
          description: null if they have no avatar or deleted their account.
        expiresAt:
          type: string
          format: date-time
        memberCount:
          type: integer
        members:
          type: array
          description: |
            The first few members, at most 4. `memberCount` says how many
            there are in total.
          items:
            $ref: "#/components/schemas/InviteMember"

    InviteMember:
      type: object
      required: [firstName, avatarUrl]
      properties:
        firstName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: null if the member has no avatar.

    InviteAccepted:
      type: object
      required: [groupId, groupName]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        groupName:
          type: string

    Locale:
      type: string
      enum: [de, en]

    Theme:
      type: string
      enum: [light, dark, system]

    DevLoginRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: string
          description: >-
            Optional. If empty, a new user gets the part of the email before
            the @, and an existing user keeps the name stored before.
          # A missing name is the same as an empty one, so Go gets a plain
          # string instead of a pointer.
          x-go-type-skip-optional-pointer: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"

    ErrorCode:
      type: string
      description: Machine-readable error; the frontend translates it.
      enum:
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - DB_UNAVAILABLE
        - UNAUTHENTICATED
        - INTERNAL_ERROR
        - CROSS_ORIGIN_REQUEST
        - INVALID_REQUEST
        - INVALID_IDENTITY
        - GROUP_NOT_FOUND
        - FORBIDDEN
        - GROUP_NAME_INVALID
        - INVALID_ROLE
        - OWNER_IMMUTABLE
        - INVITE_NOT_FOUND
        - INVITE_EXPIRED
        - TOO_MANY_INVITES
        - RATE_LIMITED
        - LIST_NOT_FOUND
        - LIST_NAME_INVALID
        - ITEM_NOT_FOUND
        - ITEM_NAME_INVALID
        - ITEM_QUANTITY_INVALID
        - ITEM_UNIT_INVALID
        - ITEM_NOTE_INVALID
        - ITEM_ID_TAKEN
      # Go constant names; without them oapi-codegen would turn NOT_FOUND
      # into NOTFOUND.
      x-enum-varnames:
        - NotFound
        - MethodNotAllowed
        - DBUnavailable
        - Unauthenticated
        - Internal
        - CrossOrigin
        - InvalidRequest
        - InvalidIdentity
        - GroupNotFound
        - Forbidden
        - GroupNameInvalid
        - InvalidRole
        - OwnerImmutable
        - InviteNotFound
        - InviteExpired
        - TooManyInvites
        - RateLimited
        - ListNotFound
        - ListNameInvalid
        - ItemNotFound
        - ItemNameInvalid
        - ItemQuantityInvalid
        - ItemUnitInvalid
        - ItemNoteInvalid
        - ItemIDTaken

    # WebSocket messages (see GET /ws). Every message has a `type` with a
    # single allowed value, so the TypeScript types narrow on it and the
    # payload follows from the type.

    PingMessage:
      type: object
      description: "Client to server: keeps the connection alive. Sent every 25 seconds; the server disconnects after 60 seconds of silence."
      required: [type]
      properties:
        type:
          type: string
          enum: [ping]

    ClientMessage:
      description: Any message the client may send.
      oneOf:
        - $ref: "#/components/schemas/PingMessage"
      discriminator:
        propertyName: type
        mapping:
          ping: "#/components/schemas/PingMessage"

    ReadyMessage:
      type: object
      description: "Server to client: the connection is set up and joined to all groups of the user. The client reloads what it has loaded via REST."
      required: [type]
      properties:
        type:
          type: string
          enum: [ready]

    PongMessage:
      type: object
      description: "Server to client: answer to `ping`."
      required: [type]
      properties:
        type:
          type: string
          enum: [pong]

    ItemChangedMessage:
      type: object
      description: "Server to client: an item was created or changed."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [itemChanged]
        payload:
          $ref: "#/components/schemas/ItemChangedPayload"

    ItemChangedPayload:
      type: object
      description: The client applies the item only if `item.serverSeq` is greater than the one it already has; events can arrive out of order.
      required: [groupId, actorId, item]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.
        item:
          $ref: "#/components/schemas/Item"

    ItemDeletedMessage:
      type: object
      description: "Server to client: an item was deleted."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [itemDeleted]
        payload:
          $ref: "#/components/schemas/ItemDeletedPayload"

    ItemDeletedPayload:
      type: object
      description: The client removes the item if `serverSeq` is greater than the one it already has for it.
      required: [groupId, listId, itemId, serverSeq, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        listId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        itemId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        serverSeq:
          type: integer
          format: int64
          description: The sequence number of the deletion.
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.

    ItemsDeletedMessage:
      type: object
      description: "Server to client: several items of one list were deleted at once, e.g. all checked items."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [itemsDeleted]
        payload:
          $ref: "#/components/schemas/ItemsDeletedPayload"

    ItemsDeletedPayload:
      type: object
      description: Every item carries its own `serverSeq`; the client removes each one as for `itemDeleted`.
      required: [groupId, listId, actorId, items]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        listId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeletedItem"

    DeletedItem:
      type: object
      description: One deleted item, in an `itemsDeleted` event or the answer of `removeCheckedItems`.
      required: [itemId, serverSeq]
      properties:
        itemId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        serverSeq:
          type: integer
          format: int64
          description: The sequence number of the deletion.

    ListChangedMessage:
      type: object
      description: "Server to client: a list was created, renamed, archived or unarchived."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [listChanged]
        payload:
          $ref: "#/components/schemas/ListChangedPayload"

    ListChangedPayload:
      type: object
      description: The client applies the list only if `list.serverSeq` is greater than the one it already has; events can arrive out of order.
      required: [actorId, list]
      properties:
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.
        list:
          $ref: "#/components/schemas/List"

    ListDeletedMessage:
      type: object
      description: "Server to client: a list was deleted together with its items."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [listDeleted]
        payload:
          $ref: "#/components/schemas/ListDeletedPayload"

    ListDeletedPayload:
      type: object
      description: Lists are deleted for good, so this event has no sequence number.
      required: [groupId, listId, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        listId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.

    GroupChangedMessage:
      type: object
      description: "Server to client: a group changed."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [groupChanged]
        payload:
          $ref: "#/components/schemas/GroupChangedPayload"

    GroupChangedPayload:
      type: object
      description: "The name, the members or the roles changed. Only a hint: the client reloads `GET /groups`, because `Group` contains the role of the requesting user."
      required: [groupId, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.

    GroupRemovedMessage:
      type: object
      description: "Server to client: the user is no longer in the group."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [groupRemoved]
        payload:
          $ref: "#/components/schemas/GroupRemovedPayload"

    GroupRemovedPayload:
      type: object
      description: The client drops the group and everything it loaded for it.
      required: [groupId, reason, actorId]
      properties:
        groupId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        reason:
          $ref: "#/components/schemas/GroupRemovedReason"
        actorId:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          description: The user who made the change.

    GroupRemovedReason:
      type: string
      description: |
        Why the user left the group: it was deleted, or the user was
        removed or left it.
      enum: [deleted, removed]
      # Go constant names (GroupRemovedReasonDeleted, ...).
      x-enum-varnames: [Deleted, Removed]

    SocketErrorMessage:
      type: object
      description: "Server to client: the server cannot continue, e.g. the message was invalid. The server usually closes the connection afterwards."
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [error]
        payload:
          $ref: "#/components/schemas/SocketErrorPayload"

    SocketErrorPayload:
      type: object
      description: The reason for the error.
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"

    ServerMessage:
      description: Any message the server may send.
      oneOf:
        - $ref: "#/components/schemas/ReadyMessage"
        - $ref: "#/components/schemas/PongMessage"
        - $ref: "#/components/schemas/ItemChangedMessage"
        - $ref: "#/components/schemas/ItemDeletedMessage"
        - $ref: "#/components/schemas/ItemsDeletedMessage"
        - $ref: "#/components/schemas/ListChangedMessage"
        - $ref: "#/components/schemas/ListDeletedMessage"
        - $ref: "#/components/schemas/GroupChangedMessage"
        - $ref: "#/components/schemas/GroupRemovedMessage"
        - $ref: "#/components/schemas/SocketErrorMessage"
      discriminator:
        propertyName: type
        mapping:
          ready: "#/components/schemas/ReadyMessage"
          pong: "#/components/schemas/PongMessage"
          itemChanged: "#/components/schemas/ItemChangedMessage"
          itemDeleted: "#/components/schemas/ItemDeletedMessage"
          itemsDeleted: "#/components/schemas/ItemsDeletedMessage"
          listChanged: "#/components/schemas/ListChangedMessage"
          listDeleted: "#/components/schemas/ListDeletedMessage"
          groupChanged: "#/components/schemas/GroupChangedMessage"
          groupRemoved: "#/components/schemas/GroupRemovedMessage"
          error: "#/components/schemas/SocketErrorMessage"
