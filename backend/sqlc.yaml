# sqlc turns the SQL in db/queries into type-safe Go code. It reads the goose
# migrations to know the schema (Down sections are ignored).
# Regenerate with `make generate`; never edit the generated files by hand.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/platform/db/sqlcgen
        sql_package: pgx/v5
        # Nullable columns become pointers (*string) instead of pgtype.Text.
        emit_pointers_for_null_types: true
        # Go spells initialisms in all caps (URL, ID); sqlc only knows "id".
        rename:
          avatar_url: AvatarURL
        # Plain Go types instead of pgx's pgtype wrappers.
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
