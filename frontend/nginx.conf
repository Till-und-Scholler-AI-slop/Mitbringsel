# Serves the built single-page app. Traefik terminates TLS in front of it
# and sends /api to the backend, so nginx only ever sees frontend paths.
server {
    listen 8080;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite writes content-hashed file names into assets/, so a changed file
    # always gets a new URL and browsers may cache these forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing asset is a real 404, not the app shell.
        try_files $uri =404;
    }

    # Everything else (index.html, favicon, later manifest and service worker)
    # must be revalidated, otherwise clients keep running an old version.
    # Unknown paths fall back to index.html so the Vue router can handle
    # deep links like /lists/123.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
