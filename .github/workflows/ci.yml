name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the outdated run. On main runs are not
# cancelled, because that could stop a deploy halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The names of the jobs Backend, Frontend, Deploy config, Image (backend) and
# Image (web) are required status checks in the ruleset "protection" of the
# repository (docs/deployment.md). Renaming one needs the ruleset changed too.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: backend

      # Fails if someone changed a query, a migration or api/openapi.yaml
      # but forgot to commit the regenerated code.
      - name: Check generated code
        run: |
          go tool sqlc generate
          go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is outdated. Run 'make generate' and commit the result."
            git status --porcelain
            exit 1
          fi

      # Integration tests start PostgreSQL via testcontainers; Docker is
      # preinstalled on GitHub's Ubuntu runners.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Fails if api/openapi.yaml changed but the TypeScript types were not
      # regenerated and committed.
      - name: Check generated API types
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API types are outdated. Run 'make generate' and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Catches a broken compose file or a variable missing from .env.example
  # in the PR, not only when deploying. Needs no secrets: the example values
  # are enough for Compose to resolve and validate the files.
  deploy-config:
    name: Deploy config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate compose files
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.staging.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml config --quiet

  # Builds both images on every run, so a broken Dockerfile fails the PR.
  # Only pushes on main, and only after tests and lint passed (needs).
  images:
    name: Image (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
          - image: web
            context: frontend
    env:
      # Image names must be lowercase, the GitHub organization name is not.
      IMAGE: ghcr.io/till-und-scholler-ai-slop/mitbringsel-${{ matrix.image }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.1

      # BuildKit builder; needed for the GitHub Actions layer cache below.
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the full commit SHA only: the deploy workflow refers to
      # exactly this commit, and there is no moving tag like "latest" that
      # could hide which version runs where.
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository, so it inherits its access rights.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # mode=max also caches the build stage (Go modules, node_modules),
          # not only the final image. One scope per image so they do not
          # evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Every green push to main goes to staging. Server access and secrets live
  # in the GitHub Environment "staging", see deploy.yml.
  deploy-staging:
    name: Deploy staging
    needs: [images, deploy-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image-tag: ${{ github.sha }}
    secrets: inherit
